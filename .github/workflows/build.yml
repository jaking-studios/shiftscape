# Builds Shiftscape with Unity in the cloud and publishes:
#   • WebGL  → GitHub Pages  (play in the browser at the repo's Pages URL)
#   • Android APK + Windows zip → workflow artifacts, and attached to a GitHub Release on tags (v1.0.0 …)
#
# One-time setup (repo Settings ▸ Secrets and variables ▸ Actions):
#   UNITY_LICENSE   – contents of your Unity_lic.ulf (see README "Publishing")
#   UNITY_EMAIL     – Unity account email
#   UNITY_PASSWORD  – Unity account password
# Then Settings ▸ Pages ▸ Source: "GitHub Actions".
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [WebGL, Android, StandaloneWindows64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Shiftscape
          buildsPath: build
          versioning: Semantic
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel34

      - name: Package Windows zip
        if: matrix.targetPlatform == 'StandaloneWindows64'
        run: cd build/StandaloneWindows64 && zip -r ../Shiftscape-Windows.zip . && cd .. && ls -la

      - name: Rename APK
        if: matrix.targetPlatform == 'Android'
        run: find build/Android -name '*.apk' -exec mv {} build/Shiftscape.apk \; && ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Shiftscape-${{ matrix.targetPlatform }}
          path: |
            build/WebGL
            build/Shiftscape.apk
            build/Shiftscape-Windows.zip
          if-no-files-found: ignore

  pages:
    name: Deploy WebGL to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shiftscape-WebGL
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: Shiftscape-Android
          path: dl
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: Shiftscape-StandaloneWindows64
          path: dl
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir -p site/play site/downloads
          cp -r docs/* site/ 2>/dev/null || true
          WEB=$(find dl -type d -name Shiftscape -path '*WebGL*' | head -1); [ -z "$WEB" ] && WEB=$(find dl -type d -path '*WebGL*' -maxdepth 2 | head -1)
          cp -r "$WEB"/* site/play/
          [ -f dl/Shiftscape.apk ] && cp dl/Shiftscape.apk site/downloads/ || true
          [ -f dl/Shiftscape-Windows.zip ] && cp dl/Shiftscape-Windows.zip site/downloads/ || true
          ls -R site | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - run: cd dl && find . -maxdepth 3 -type d -path '*WebGL*' | head -1 | xargs -I{} sh -c 'cd {} && zip -r ../../Shiftscape-WebGL.zip .' ; ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dl/**/Shiftscape.apk
            dl/**/Shiftscape-Windows.zip
            dl/Shiftscape-WebGL.zip
          generate_release_notes: true
