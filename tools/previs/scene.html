<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
.panel{position:absolute;background:rgba(10,12,22,.55);border-radius:14px;padding:10px 16px}
#tl{left:16px;top:16px;width:300px}
#tl .h{font-size:24px;font-weight:800;color:#ff5e3a;letter-spacing:2px}
#tl .s{font-size:16px;margin-top:4px}
#tc{left:50%;top:14px;transform:translateX(-50%);text-align:center;background:none}
#tc .r{font-weight:800;font-size:16px;text-shadow:0 2px 2px #0009;letter-spacing:1px}

#rw{font-size:13px;font-weight:800}

#void{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:22px;font-weight:800;text-shadow:0 3px 3px #000a;letter-spacing:2px}
#hint{position:absolute;right:16px;bottom:16px;font-size:12px;color:#fff9;text-shadow:0 1px 2px #000}
.touch{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
</style></head>

  const Wd=innerWidth,Hd=innerHeight;mk(60,Hd-230,90,'',"#fff",.12);mk(100,Hd-190,38,'','#fff',.45);mk(Wd-150,Hd-150,60,'JUMP',t.accent,.5);mk(Wd-260,Hd-122,46,'DASH','#fff',.35);mk(Wd-128,Hd-290,46,'USE','#ffd34d',.4);mk(Wd-280,Hd-262,46,'⟲','#ffd34d',.4);mk(Wd-80,16,32,'II','#fff',.35);}

  scene.children.forEach(o=>{if(o.userData.f){const f_=o.userData.f;o.position.y=f_.y+Math.sin(tt*f_.s+f_.o)*f_.a;}});
  const vz = mode==='void' ? pz-13+Math.sin(tt)*1.5 : pz-30;
  voidG.position.set(av.position.x,av.position.y+20,vz); vm.opacity=.8+.08*Math.sin(tt*3);
  voidG.children.forEach(m=>{if(m.userData.v){m.position.addScaledVector(m.userData.v,.02);if(m.position.y>12)m.position.y=-2;if(Math.abs(m.position.x)>15)m.position.x*=-.9;m.rotation.x+=.02;m.rotation.y+=.03;}});
  // camera
  const up = (mode==='gravity'&&pz>20&&pz<48)?-1:1;
  const pivot=av.position.clone().add(new THREE.Vector3(0,1.2*up,0));
  let yaw=Math.sin(tt*.4)*.25, pitch=.32;
  if(camKind==='orbit'){yaw=tt*.5;pitch=.35;}
  if(camKind==='hero'){yaw=.9;pitch=.22;}
  if(camKind==='front'){yaw=Math.PI-.35+Math.sin(tt*.6)*.15;pitch=.2;}
  const back=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch)*up,-Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(camKind==='hero'?6.2:5.6);
  cam.position.copy(pivot).add(back); cam.up.set(0,up,0); cam.lookAt(pivot);
  sun.position.set(av.position.x-20,40,av.position.z-10); sun.target.position.copy(av.position);
  // HUD
  document.getElementById('time').textContent=(tt+12.4).toFixed(2)+'s';document.getElementById('sh').textContent=Math.min(shards.length+6,Math.floor(3+u*(shards.length+3)));
  const ri=Math.min(rooms,1+Math.floor(u*rooms));document.getElementById('room').textContent=`ROOM ${ri} / ${rooms}`;document.getElementById('prog').style.width=(u*100)+'%';
  const dist=av.position.z-vz; hudVoid.textContent= dist<28 ? (dist<8?'THE VOID IS HERE':'VOID  '+dist.toFixed(0)+'m') : ''; hudVoid.style.color=dist<12?'#ff5e3a':'#fff';
  document.getElementById('vig').style.background= dist<28 ? `radial-gradient(ellipse at center,transparent 50%,${t.voidC}cc 100%)`:'radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)';
  hudToast.textContent = q.get('toast')||((tt<1.2&&f>0)?'CHECKPOINT':(mode==='gravity'&&pz>18&&pz<24?'GRAVITY FLIP':''));
  renderer.render(scene,cam);
};
window.frames=frames;
window.renderFrame(frame);
window.ready=true;
</script></body></html>
